<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goutham Super Market</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fa;
}

/* Header */
header{
    background:linear-gradient(135deg,#0d6efd,#00b894);
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:32px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
    gap:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    padding:10px 15px;
}

nav ul li a:hover{
    background:white;
    color:#0d6efd;
    border-radius:5px;
}

/* Hero Section */
.hero{
    text-align:center;
    padding:50px;
}

.hero h1{
    color:#0d6efd;
    margin-bottom:15px;
}

.hero p{
    font-size:20px;
    margin-bottom:30px;
}

/* Single Image */
.hero img{
    width:90%;
    max-width:1000px;
    height:500px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

/* Button */
.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 30px;
    background:#00b894;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.btn:hover{
    background:#0d6efd;
}

/* Footer */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>

</head>
<body>

<header>
    <div class="logo">Goutham Super Market</div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="offers.html">Offers</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <h1>WELCOME TO GOUTHAM SUPER MARKET</h1>
    <p>Fresh Groceries, Fruits, Vegetables & Daily Essentials at Best Prices.</p>

    <!-- Single Home Page Image -->
    <img src="index.png"
         alt="Goutham Super Market">

    <br>
    <a href="products.html" class="btn">Explore Products</a>
</section>

<footer>
    <p>© 2026 Goutham Super Market | Freshness • Quality • Savings</p>
</footer>

</body>
</html>
